<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Loja Impossível: encontre artefatos lendários de animes.">
  <title>Loja Impossível | Artefatos Lendários</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🛸 Loja Impossível</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Vitrine</a></li>
            <li class="nav-item">
              <a class="nav-link position-relative" href="carrinho.html">
                🛒 Carrinho
                <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="conteudo">
    <section class="hero py-5 text-center">
      <div class="container">
        <p class="eyebrow mb-2">O bazar do absurdo</p>
        <h1 class="display-4 fw-bold text-light">Artefatos que desafiam a realidade.</h1>
        <p class="lead col-lg-8 mx-auto text-secondary">Explore nossa coleção de invenções lendárias dos animes. Compre por sua conta e risco.</p>
      </div>
    </section>

    <section class="container py-5" aria-labelledby="titulo-produtos">
      <div class="row mb-5 align-items-end">
        <div class="col-md-4 mb-3 mb-md-0">
          <h2 id="titulo-produtos" class="h3 mb-0 fw-bold text-light">Catálogo</h2>
        </div>
        <div class="col-md-3 mb-3 mb-md-0">
          <label for="filtroProduto" class="form-label text-light">Buscar por nome</label>
          <input id="filtroProduto" class="form-control" type="search" placeholder="Ex.: Akuma no Mi..." autocomplete="off">
        </div>
        <div class="col-md-2 mb-3 mb-md-0">
          <label for="filtroRegra" class="form-label text-light">Filtrar Regra</label>
          <select id="filtroRegra" class="form-select">
            <option value="">Todas</option>
            <option value="Cabe em um bolso">Cabe em um bolso</option>
            <option value="Não cabe em um avião">Não cabe em um avião</option>
            <option value="Usado no espaço sideral">Espaço sideral</option>
            <option value="Serve em uma formiga">Serve em formiga</option>
            <option value="Começa com Z">Começa com Z</option>
            <option value="Uso único">Uso único</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="ordenacao" class="form-label text-light">Ordenar por</label>
          <select id="ordenacao" class="form-select">
            <option value="padrao">Padrão</option>
            <option value="preco-asc">Menor Preço</option>
            <option value="preco-desc">Maior Preço</option>
            <option value="nome-asc">Nome (A-Z)</option>
          </select>
        </div>
      </div>

      <div class="row g-4" id="listaProdutos"></div>
      <p id="mensagemFiltro" class="mt-4 text-center text-danger fw-bold" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer py-4 text-center border-top border-secondary mt-5">
    <div class="container"><p class="mb-0 text-secondary">Loja Impossível · Nenhuma lei da física foi ferida.</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
